[package]
name = "lazy-pdf-fonts-fuzz"
version = "0.0.0"
edition = "2024"
license-file = "../../../LICENSE"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"

[dependencies.lazy-pdf-fonts]
path = ".."

[dependencies.lazy-pdf-syntax]
path = "../../lazy-pdf-syntax"

[dependencies.lazy-pdf-text]
path = "../../lazy-pdf-text"

[[bin]]
name = "truetype"
path = "fuzz_targets/truetype.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cff"
path = "fuzz_targets/cff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "type1"
path = "fuzz_targets/type1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmap"
path = "fuzz_targets/cmap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font"
path = "fuzz_targets/font.rs"
test = false
doc = false
bench = false

[workspace]
