[workspace]
resolver = "3"
members = ["lazy-link"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license-file = "../LICENSE"
publish = false

[profile.release]
# Every cdylib and staticlib has to unwind: UniFFI turns a panic into an exception only if it can catch it.
panic = "unwind"
