[package]
name = "lazy-link-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
# The native tests trust the development relay's authority; no app build turns this on.
dev-roots = ["lazy-link/dev-roots"]

[dependencies]
async-trait = "0.1"
lazy-link = { path = "../lazy-link", features = ["relay"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "io-util", "macros"] }
uniffi = { workspace = true, features = ["tokio"] }
