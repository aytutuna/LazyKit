[graph]
all-features = true
exclude-dev = true

[licenses]
# Only permissive licences: the apps ship these crates in closed, store-distributed builds, so GPL, LGPL and the like stay out.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-roots, Mozilla's CA list, which the Android build checks the relay against; the platform verifier also
    # reaches webpki-root-certs under it, on systems the apps do not ship for and in the wasm build, which has no TLS
    "CDLA-Permissive-2.0",
    # UniFFI (the Swift, Kotlin and C# bindings) is MPL-2.0: file-level, so unmodified use only needs its notice and source link
    "MPL-2.0",
]
confidence-threshold = 0.9

# the workspace's own crates carry the PolyForm Noncommercial licence file and are never published
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# TLS is rustls on aws-lc-rs, in Rust, on every platform. Nothing else may bring its own: ring, OpenSSL
# and the system-linked native-tls stay out.
deny = [
    { name = "ring" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
