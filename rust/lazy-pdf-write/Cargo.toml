[package]
name = "lazy-pdf-write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
lazy-pdf-filters = { path = "../lazy-pdf-filters" }
getrandom = "0.4"
lazy-pdf-syntax = { path = "../lazy-pdf-syntax" }

# The browser has random bytes but, for the file, no clock this crate may read.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
