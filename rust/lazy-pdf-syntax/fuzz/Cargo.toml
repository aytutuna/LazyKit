version = "0.0.0"
edition = "2024"
license-file = "../../../LICENSE"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
miniz_oxide = "0.9"

[dependencies.lazy-pdf-syntax]
path = ".."

[[bin]]
name = "lexer"
