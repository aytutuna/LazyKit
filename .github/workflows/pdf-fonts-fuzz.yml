name: pdf-fonts-fuzz

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - rust/lazy-pdf-fonts/**
      - rust/lazy-pdf-syntax/**
      - rust/lazy-pdf-filters/**
      - rust/Cargo.lock
      - rust/Cargo.toml
      - testdata/pdf-fonts/**
      - rust/rust-toolchain.toml
      - .github/workflows/pdf-fonts-fuzz.yml
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz passes sanitizer flags that only nightly accepts; this lets the pinned stable toolchain take them.
  RUSTC_BOOTSTRAP: 1
  CARGO_FUZZ: 0.13.2

defaults:
  run:
    working-directory: rust/lazy-pdf-fonts

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [truetype, cff, type1, cmap, content, font]
    env:
      # A short run on every push, a long one every week.
      SECONDS_TO_FUZZ: ${{ github.event_name == 'schedule' && 1500 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust/lazy-pdf-fonts/fuzz
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/lazy-pdf-fonts/fuzz/corpus/${{ matrix.target }}
          key: pdf-fonts-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: pdf-fonts-fuzz-corpus-${{ matrix.target }}-
      - run: cargo fmt --check
        working-directory: rust/lazy-pdf-fonts/fuzz
      - run: cargo install cargo-fuzz --version "$CARGO_FUZZ" --locked
      # cargo-fuzz has no --locked of its own, so the lock file is checked here.
      - run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - run: mkdir -p fuzz/corpus/${{ matrix.target }}
      - run: cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -max_total_time=$SECONDS_TO_FUZZ -rss_limit_mb=2048 -timeout=20
      # A crash input and the corpus that led to it are kept even when the run fails.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: rust/lazy-pdf-fonts/fuzz/corpus/${{ matrix.target }}
          key: pdf-fonts-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: rust/lazy-pdf-fonts/fuzz/artifacts/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
