name: pdf-filters-fuzz

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - rust/lazy-pdf-filters/**
      - testdata/pdf-filters/**
      - .github/workflows/pdf-filters-fuzz.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-11-20
  CARGO_FUZZ: 0.13.2

defaults:
  run:
    working-directory: rust/lazy-pdf-filters

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [flate, lzw, ascii, ccitt, jbig2, dct]
    env:
      # A push gets a short smoke run; the weekly job runs each target for a quarter of an hour.
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && 900 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ }}-${{ runner.os }}-${{ env.NIGHTLY }}
      - run: cargo-fuzz --version 2>/dev/null | grep -qx "cargo-fuzz ${CARGO_FUZZ}" || cargo +"$NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ" --locked
      - name: Lock
        run: cargo +"$NIGHTLY" fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Seeds
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          if [ "${{ matrix.target }}" = jbig2 ]; then
            for f in ../../testdata/pdf-filters/*.bin; do
              { printf '\0\0\0\0\0'; cat "$f"; } > "fuzz/corpus/jbig2/$(basename "$f")"
            done
          fi
      - name: Fuzz
        run: cargo +"$NIGHTLY" fuzz run "${{ matrix.target }}" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=3072 -timeout=30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: rust/lazy-pdf-filters/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
