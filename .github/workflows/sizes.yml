name: sizes

# The release library of lazy-link-ffi per target, before and after TLS moved into Rust.
on:
  push:
    branches: ['ci/**']
    paths:
      - .github/workflows/sizes.yml

permissions:
  contents: read

env:
  BASE: 511a57d
  CARGO_NDK: 4.1.2
  NDK_VERSION: 27.3.13750724
  AWS_LC_SYS_CMAKE_BUILDER: 0
  AWS_LC_SYS_PREBUILT_NASM: 1
  AWS_LC_SYS_USE_SYSTEM: 0

jobs:
  size:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, lib: lazy_link_ffi.dll }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, lib: lazy_link_ffi.dll }
          - { os: macos-latest, target: aarch64-apple-darwin, lib: liblazy_link_ffi.dylib }
          - { os: macos-latest, target: aarch64-apple-ios, lib: liblazy_link_ffi.a }
          - { os: macos-latest, target: aarch64-apple-ios-sim, lib: liblazy_link_ffi.a }
          - { os: ubuntu-latest, target: aarch64-linux-android, lib: liblazy_link_ffi.so, abi: arm64-v8a }
          - { os: ubuntu-latest, target: x86_64-linux-android, lib: liblazy_link_ffi.so, abi: x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - shell: bash
        run: git worktree add ../base "$BASE"
      - if: matrix.abi
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK" --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - shell: bash
        run: |
          for tree in "$PWD/../base" "$PWD"; do
            cd "$tree/rust"
            rustup target add "${{ matrix.target }}"
            if [ -n "${{ matrix.abi }}" ]; then
              cargo ndk -t "${{ matrix.abi }}" -P 26 build --locked --release -p lazy-link-ffi
            else
              cargo build --locked --release -p lazy-link-ffi --target "${{ matrix.target }}"
            fi
            echo "SIZE $(basename "$tree") ${{ matrix.target }} $(wc -c < "target/${{ matrix.target }}/release/${{ matrix.lib }}") ${{ matrix.lib }}"
          done
